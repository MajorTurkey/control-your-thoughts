<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Control your thoughts</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{--space:#0A0F18;--navy:#1B2A4A;--gold:#B8922A;--paper:#F0EDE8;--ash:#8A8880;--line:rgba(184,146,42,.35)}
*{box-sizing:border-box}html,body{margin:0;background:var(--space);color:var(--paper);font-family:IBM Plex Sans,sans-serif}
.page{max-width:820px;margin:0 auto;padding:40px 24px 80px}
.orbit{width:72px;height:36px;margin-bottom:18px;border:1px solid var(--gold);border-radius:50%;position:relative}
.orbit:after{content:"";width:6px;height:6px;background:var(--gold);border-radius:50%;position:absolute;left:50%;top:-3px;transform:translateX(-50%)}
.kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
h1{font-family:Cormorant Garamond,serif;font-weight:500;font-size:clamp(2.4rem,6vw,3.6rem);margin:10px 0 14px;line-height:1}
.model-blurb{font-family:Cormorant Garamond,serif;font-style:italic;font-size:1.2rem;color:var(--ash);max-width:36em}
label.field-name{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash);margin:16px 0 8px}
textarea,input[type=text]{width:100%;font:1.05rem/1.45 IBM Plex Sans,sans-serif;background:#0d1522;border:1px solid var(--line);color:var(--paper);padding:14px 16px}
textarea:focus,input:focus{outline:none;border-color:var(--gold)}
button.press{letter-spacing:.16em;text-transform:uppercase;font-size:11px;background:var(--gold);color:var(--space);border:0;padding:14px 22px;cursor:pointer;font-weight:600;margin-top:16px}
button.press:disabled{opacity:.4}button.ghost{background:transparent;color:var(--paper);border:1px solid var(--line);margin-left:8px}
.hint{color:var(--ash);font-size:.9rem}.stage{margin-top:32px}
.frame{background:linear-gradient(180deg,#2a3a62,#141c2e 38%,#0b1018);padding:42px 16px 16px;border:1px solid var(--gold);box-shadow:0 0 0 8px #0d1320,0 0 0 9px var(--line);position:relative}
.frame-rail{position:absolute;top:0;left:0;right:0;height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ash);border-bottom:1px solid var(--line)}
.frame-rail b{color:var(--gold)}.screw{width:8px;height:8px;border:1px solid var(--gold);border-radius:50%;background:radial-gradient(circle at 30% 30%,#d4b056,#6a5418)}
.frame img{display:block;width:100%;min-height:280px;background:#111}.status{color:var(--ash);font-size:.9rem}
.err{color:#d27a6a}.book{margin-top:28px;padding:24px;background:var(--navy);border:1px solid var(--line)}
.book h2{font-family:Cormorant Garamond,serif;font-weight:500;font-size:1.7rem;margin:6px 0 10px}
.examples{margin:12px 0 20px;padding:0;list-style:none}
.examples li{font-family:Cormorant Garamond,serif;font-style:italic;border-left:1px solid var(--gold);padding:6px 0 6px 12px;margin:8px 0}
.examples button.feed{display:block;margin-top:4px;font-family:IBM Plex Sans,sans-serif;font-style:normal;font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:none;border:0;color:var(--gold);cursor:pointer;padding:0}
.blank-grid{display:grid;gap:14px}.hidden{display:none}footer{margin-top:48px;font-size:12px;color:var(--ash);border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<main class="page">
<div class="orbit"></div>
<div class="kicker">Instrument</div>
<h1>Control your thoughts</h1>
<p class="model-blurb" id="modelBlurb"></p>
<form id="firstForm">
<label class="field-name" for="ordinary">What you want to see</label>
<textarea id="ordinary" rows="4" required placeholder="A wet cobblestone street at dusk, one yellow window lit, a bicycle leaning on a rail."></textarea>
<button class="press" type="submit" id="makeBtn">Generate</button>
</form>
<section class="stage hidden" id="result">
<div class="frame">
<div class="frame-rail"><span class="screw"></span><span><b>Apogee</b> · In · Ch</span><span class="screw"></span></div>
<img id="plateImg" alt="Generated image"/>
</div>
<p class="status" id="status"></p>
</section>
<section class="book hidden" id="revise">
<div class="kicker">Mark the proof</div>
<h2>What is missing. What should change.</h2>
<p class="hint">Short clauses. Full sentences. Both work.</p>
<ul class="examples" id="examples"></ul>
<div class="blank-grid">
<label class="field-name" for="missing">Missing</label>
<input id="missing" type="text" placeholder="a figure under the window"/>
<label class="field-name" for="different">Different</label>
<input id="different" type="text" placeholder="colder light, closer"/>
<label class="field-name" for="mustNot">Leave out</label>
<input id="mustNot" type="text" placeholder="cars, modern signs"/>
<label class="field-name" for="freeNote">Your words</label>
<textarea id="freeNote" rows="3" placeholder="Keep the yellow window."></textarea>
</div>
<button class="press" type="button" id="reviseBtn">Generate again</button>
<button class="press ghost" type="button" id="resetBtn">Start over</button>
</section>
<footer>You speak. It renders. You correct. That is the loop.</footer>
</main>
<script src="./press.js"></script>
</body>
</html>
